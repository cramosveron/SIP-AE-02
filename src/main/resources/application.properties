spring.datasource.url=jdbc:postgresql://localhost:5432/acompanaeduca
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-5.2

evaluation.questions.default-count=5
evaluation.questions.min-count=3
evaluation.questions.max-count=10
evaluation.text.min-length=100
evaluation.text.max-length=12000