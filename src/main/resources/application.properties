spring.datasource.url=jdbc:h2:mem:acompanaeduca;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

server.port=5555
spring.devtools.restart.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-5.2

evaluation.questions.default-count=5
evaluation.questions.min-count=3
evaluation.questions.max-count=10
evaluation.text.min-length=100
evaluation.text.max-length=12000